[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdlight"
version = "0.1.0"
description = "Multiphysics solid-state Tesla coil simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "numba>=0.67.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=14.2.0"]
io = ["xarray>=2026.7.0", "pandas>=3.0.5", "pyarrow>=25.0.1"]
viz = ["matplotlib>=3.11.1"]
dev = [
    "xarray>=2026.7.0", "pandas>=3.0.5", "pyarrow>=25.0.1", "matplotlib>=3.11.1",
    "pytest>=9.1.1", "pytest-xdist>=3.8.0", "pytest-cov>=7.1.0",
    "black>=26.5.1", "pylint>=4.0.8",
]

[tool.setuptools.packages.find]
include = ["thirdlight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto -q"
markers = [
    "cuda: requires a CUDA device",
    "slow: large-size numerical test, skipped under NUMBA_DISABLE_JIT",
]

[tool.black]
target-version = ["py311"]

[tool.pylint.main]
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-many-arguments", "too-many-positional-arguments", "too-many-locals", "too-few-public-methods", "duplicate-code"]

[tool.pylint.typecheck]
ignored-modules = ["cupy", "scipy.special", "scipy.linalg"]

[tool.pylint.basic]
good-names = ["E_on", "E_off", "E_rr", "a", "b", "c", "d", "e", "f", "i", "j", "k", "m", "n", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z", "dz", "xp", "L", "C", "P", "R", "D", "N", "M", "K", "E"]
